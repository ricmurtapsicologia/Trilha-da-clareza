name: Trilha — prática breve (validação técnica)
on:
  push:
    branches:
      - feature/valor-clinico-20261104
  pull_request:
    paths:
      - 'pratica*'
      - 'src/app.ts'
      - 'dist/app.js'
      - 'style.css'
      - 'tests/quick*'
      - '.github/workflows/value-flow.yml'
jobs:
  verificacao:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências fixadas
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Tipagem, compilação, integridade e testes Node
        run: |
          npm run typecheck
          npm run build
          npm run verify:build
          npm test
      - name: Instalar navegador E2E
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Navegador real — prática breve
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/trilha-http.log 2>&1 &
          sleep 3
          python tests/quick_e2e.py --url http://127.0.0.1:8765/pratica.html
