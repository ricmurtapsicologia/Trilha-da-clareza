name: Importar MVP verificado
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import-mvp:
    if: contains(github.event.head_commit.message, '[bootstrap-mvp]')
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Restaurar e verificar integridade do MVP
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-*.b64 | base64 --decode > /tmp/trilha-da-clareza-mvp.tar.xz
          echo "238dc7fad45909b10d99663548fd2f5adc8db6f0718815cded8df3051cb745ab  /tmp/trilha-da-clareza-mvp.tar.xz" | sha256sum --check -
          mkdir -p /tmp/trilha-restored
          tar -xJf /tmp/trilha-da-clareza-mvp.tar.xz -C /tmp/trilha-restored
          test -f /tmp/trilha-restored/index.html
          test -f /tmp/trilha-restored/dist/app.js
          test -f /tmp/trilha-restored/dist/content.js
          test -f /tmp/trilha-restored/dist/domain.js
          cp -a /tmp/trilha-restored/. .
          rm -rf bootstrap
          node --test tests/domain.test.mjs
      - name: Registrar código e documentação no GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada para registrar"
          else
            git commit -m "feat: instalar MVP 0.1.0 verificado [skip ci]"
            git push origin HEAD:main
          fi
