name: Validar MVP
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependências reprodutíveis (sem scripts externos)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Tipos
        run: npm run typecheck
      - name: Compilação
        run: npm run build
      - name: Verificar fonte x distribuição
        run: npm run verify:build
      - name: Testes unitários
        run: npm test
      - name: Onda 9 — registrar NO-GO e hashes da candidata
        run: node scripts/release_preflight.mjs --out wave9-evidence/release-readiness.json
      - name: Onda 9 — comprovar que não há liberação automática
        run: |
          set -e
          node scripts/release_preflight.mjs --require-ready && exit 1 || CODE=$?
          test "$CODE" -eq 2
          echo "PASS: liberação clínica bloqueada como esperado"
      - name: Anexar evidência de pré-publicação não homologada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onda9-relatorio-preflight-NO-GO
          path: wave9-evidence/release-readiness.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Smoke HTTPS (demonstração atual no GitHub Pages)
        run: bash tests/public_smoke.sh
      - name: Verificar integridade de arquivos estáticos
        run: |
          python - <<'PY'
          from pathlib import Path
          required=['index.html','style.css','assets/favicon.svg','dist/app.js','dist/content.js','dist/domain.js','src/app.ts','src/content.ts','src/domain.ts','docs/GATES_DE_LIBERACAO.md']
          for f in required:
              p=Path(f)
              assert p.is_file() and p.stat().st_size>0, f'Arquivo inválido: {f}'
          html=Path('index.html').read_text(encoding='utf-8')
          assert 'Trilha da Clareza' in html
          assert './dist/app.js' in html
          assert "connect-src 'none'" in html
          print('Estrutura estática e CSP inicial verificadas')
          PY

  e2e_browser_http:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Chromium e Playwright fixados
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Testar versão candidata em servidor HTTP local
        run: |
          python -m http.server 8765 --bind 127.0.0.1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          sleep 2
          python tests/hosted_e2e.py --url http://127.0.0.1:8765/ --candidate
          python tests/wave8_synthetic.py --url http://127.0.0.1:8765/ --out wave8-evidence/synthetic-dry-run.json
          python tests/wave7_http_probe.py --url http://127.0.0.1:8765/ --out wave7-evidence/http-candidate.json
          curl --fail --location --silent --show-error --retry 3 \
            https://cdnjs.cloudflare.com/ajax/libs/axe-core/4.10.3/axe.min.js \
            -o /tmp/axe-core-4.10.3.min.js
          python tests/wave6_browser.py --url http://127.0.0.1:8765/ --axe /tmp/axe-core-4.10.3.min.js
      - name: Testar versão atualmente publicada no GitHub Pages
        run: |
          python tests/hosted_e2e.py --url https://ricmurtapsicologia.github.io/Trilha-da-clareza/
          python tests/wave7_http_probe.py --url https://ricmurtapsicologia.github.io/Trilha-da-clareza/ --out wave7-evidence/http-pages.json
      - name: Evidência de pré-piloto exclusivamente sintético (Onda 8)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onda8-ensaio-sintetico-sem-participantes
          path: wave8-evidence/synthetic-dry-run.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Evidências de integridade e cabeçalhos HTTP (Onda 7)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onda7-probes-http-sem-dados-pessoais
          path: wave7-evidence/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Auditoria automatizada de acessibilidade e privacidade (Onda 6)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onda6-axe-privacidade-nao-homologado
          path: wave6-evidence/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Evidências visuais da Onda 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onda2-ux-mobile-desktop-nao-homologado
          path: ux-evidencias/*.png
          if-no-files-found: ignore
          retention-days: 14
