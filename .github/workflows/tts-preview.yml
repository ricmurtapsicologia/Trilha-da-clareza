name: Amostras TTS para revisão (não publicar)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tts-preview.yml'
      - 'scripts/tts_preview.py'
      - 'src/content.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview_neural:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar síntese local livre e compilar roteiros
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          python -m pip install --disable-pip-version-check piper-tts==1.3.0
          command -v ffmpeg
          command -v piper
          node --input-type=module -e "import { audios } from './dist/content.js'; import {writeFileSync} from 'node:fs'; writeFileSync('audios-preview.json',JSON.stringify(audios));"
      - name: Baixar modelo PT-BR para geração transitória
        run: |
          mkdir -p /tmp/trilha-tts-model
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/pt/pt_BR/faber/medium"
          curl --fail --location --retry 3 --silent --show-error "$BASE/pt_BR-faber-medium.onnx" -o /tmp/trilha-tts-model/voice.onnx
          curl --fail --location --retry 3 --silent --show-error "$BASE/pt_BR-faber-medium.onnx.json" -o /tmp/trilha-tts-model/voice.onnx.json
          test "$(stat -c%s /tmp/trilha-tts-model/voice.onnx)" -gt 40000000
      - name: Gerar 12 MP3 para escuta e análise (não incluir no site)
        run: |
          python scripts/tts_preview.py \
            --source audios-preview.json \
            --model /tmp/trilha-tts-model/voice.onnx \
            --config /tmp/trilha-tts-model/voice.onnx.json \
            --output /tmp/trilha-tts-preview
      - name: Disponibilizar amostras temporárias, sem uso clínico
        uses: actions/upload-artifact@v4
        with:
          name: trilha-da-clareza-amostras-neurais-NAO-HOMOLOGADAS
          path: /tmp/trilha-tts-preview/
          retention-days: 7
