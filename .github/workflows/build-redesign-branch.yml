name: Compilar UX 2.0 na branch de revisão
on:
  push:
    branches:
      - redesign/ux-valor-pagina-unica-20261104
    paths:
      - 'src/app.ts'
      - '.github/workflows/build-redesign-branch.yml'
permissions:
  contents: write
jobs:
  dist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Compilar com o TypeScript fixado pelo projeto
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Registrar somente a distribuição recompilada
        run: |
          git diff --exit-code -- dist/app.js && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/app.js
          git commit -m "build(ux): sincronizar dist/app.js com src/app.ts"
          git push origin HEAD:refs/heads/redesign/ux-valor-pagina-unica-20261104
