name: Compilar atividade semanal na branch
on:
  push:
    branches:
      - feature/leitura-semanal-valor-20261105
    paths:
      - 'src/app.ts'
      - '.github/workflows/build-weekly-branch.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Compilar distribuição
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Sincronizar dist na branch
        run: |
          if git diff --exit-code -- dist/app.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/app.js
          git commit -m "build: sincronizar leitura semanal no dist"
          git push origin HEAD:refs/heads/feature/leitura-semanal-valor-20261105
