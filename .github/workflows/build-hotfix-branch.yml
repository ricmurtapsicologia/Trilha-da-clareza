name: Compilar Hotfix 2026-11
on:
  push:
    branches: [hotfix/ciclo-executivo-20261105]
    paths:
      - 'src/app.ts'
      - '.github/workflows/build-hotfix-branch.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: TypeScript e build reprodutíveis
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Versionar distribuição correspondente
        run: |
          if git diff --exit-code -- dist/app.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/app.js
          git commit -m "build: atualizar distribuição do hotfix"
          git push origin HEAD:refs/heads/hotfix/ciclo-executivo-20261105
